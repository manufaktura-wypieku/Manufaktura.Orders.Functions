name: Copilot Address Review Comments

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  assign-copilot:
    # Only trigger when Copilot (or another automated reviewer) submits a review
    # with changes requested, so Copilot can address its own feedback
    if: |
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot to address review comments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Assign GitHub Copilot coding agent to the PR
            // This triggers Copilot to read the review comments and push fixes
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: ['copilot']
            });

            // Leave a comment so the team knows Copilot is working on it
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🤖 Copilot review detected with change requests. Copilot coding agent has been assigned to address the feedback.\n\nOnce Copilot pushes its changes, re-request a review.`
            });
